<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>PocketAI</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0d1117;
  color: white;
  min-height: 100vh;
}

.app {
  max-width: 800px;
  margin: auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 18px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

h1 {
  margin: 0;
  font-size: 26px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 11px 15px;
  font-weight: bold;
  cursor: pointer;
}

#adminBtn {
  background: #242b36;
  color: white;
}

#messages {
  flex: 1;
  overflow: auto;
  padding: 10px 0;
}

.msg {
  max-width: 85%;
  padding: 12px 14px;
  border-radius: 15px;
  margin: 8px 0;
  line-height: 1.4;
  white-space: pre-wrap;
}

.user {
  background: #315efb;
  margin-left: auto;
}

.ai {
  background: #202731;
  margin-right: auto;
}

form {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

input,
textarea {
  width: 100%;
  border: 1px solid #394452;
  background: #161c24;
  color: white;
  border-radius: 12px;
  padding: 12px;
  font-size: 16px;
}

form button {
  background: #315efb;
  color: white;
}

.panel {
  display: none;
  background: #161c24;
  border: 1px solid #394452;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
}

.panel h2 {
  margin-top: 0;
}

.panel button {
  margin-top: 8px;
}

#saveBtn {
  background: #22a06b;
  color: white;
}

#closeBtn {
  background: #394452;
  color: white;
}

.small {
  color: #aab4c0;
  font-size: 13px;
}

</style>

</head>

<body>

<div class="app">

<header>

<h1>🧠 PocketAI</h1>

<button id="adminBtn">
🔐 Admin
</button>

</header>


<section
  id="adminPanel"
  class="panel"
>

<h2>Admin-Wissen</h2>

<p class="small">
Nur mit dem Admin-Passwort kannst du
neues Wissen speichern.
</p>

<input
  id="password"
  type="password"
  placeholder="Admin-Passwort"
>

<textarea
  id="knowledge"
  rows="5"
  placeholder="Neue Information, z. B.:
HyperRun ist ein Endless-Runner-Spiel."
></textarea>

<button id="saveBtn">
☁️ Wissen speichern
</button>

<button id="closeBtn">
Schließen
</button>

<p
  id="status"
  class="small"
></p>

</section>


<div id="messages">

<div class="msg ai">

Hallo! 👋

Ich weiß nur Dinge,
die mir vorher beigebracht wurden.

Frag mich etwas.

</div>

</div>


<form id="chatForm">

<input
  id="question"
  autocomplete="off"
  placeholder="Stelle eine Frage ..."
>

<button type="submit">
Senden
</button>

</form>

</div>


<script>


// =================================================
// HIER DEINE SUPABASE EDGE-FUNCTION EINTRAGEN
// =================================================

const FUNCTION_URL =
  "https://hmcszjrbcuxxolskqgu.supabase.co/functions/v1/pocketai";


// =================================================
// ELEMENTE
// =================================================

const messages =
  document.getElementById("messages");

const form =
  document.getElementById("chatForm");

const question =
  document.getElementById("question");

const adminPanel =
  document.getElementById("adminPanel");

const adminBtn =
  document.getElementById("adminBtn");

const closeBtn =
  document.getElementById("closeBtn");

const saveBtn =
  document.getElementById("saveBtn");

const password =
  document.getElementById("password");

const knowledge =
  document.getElementById("knowledge");

const status =
  document.getElementById("status");


// =================================================
// NACHRICHT HINZUFÜGEN
// =================================================

function addMessage(text, type) {

  const div =
    document.createElement("div");

  div.className =
    "msg " + type;

  div.textContent =
    text;

  messages.appendChild(div);

  messages.scrollTop =
    messages.scrollHeight;
}


// =================================================
// ADMIN ÖFFNEN
// =================================================

adminBtn.onclick = () => {

  adminPanel.style.display =
    "block";

};


// =================================================
// ADMIN SCHLIESSEN
// =================================================

closeBtn.onclick = () => {

  adminPanel.style.display =
    "none";

  password.value = "";

  knowledge.value = "";

  status.textContent = "";

};


// =================================================
// WISSEN SPEICHERN
// =================================================

saveBtn.onclick = async () => {

  if (
    !password.value ||
    !knowledge.value.trim()
  ) {

    status.textContent =
      "Bitte Passwort und Information eingeben.";

    return;
  }


  status.textContent =
    "☁️ Speichere ...";


  try {

    const response =
      await fetch(
        FUNCTION_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            action: "add",

            password:
              password.value,

            knowledge:
              knowledge.value.trim()

          })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Fehler"
      );

    }


    status.textContent =
      "✅ Wissen wurde in der Cloud gespeichert.";

    knowledge.value = "";


  } catch (error) {

    status.textContent =
      "❌ " + error.message;

  }

};


// =================================================
// FRAGE STELLEN
// =================================================

form.onsubmit = async (event) => {

  event.preventDefault();


  const q =
    question.value.trim();


  if (!q) {
    return;
  }


  addMessage(
    q,
    "user"
  );


  question.value = "";


  addMessage(
    "🤔 Ich denke nach ...",
    "ai"
  );


  const thinking =
    messages.lastElementChild;


  try {

    const response =
      await fetch(
        FUNCTION_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            action: "ask",

            question: q

          })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Fehler"
      );

    }


    thinking.textContent =
      data.answer;


  } catch (error) {

    thinking.textContent =
      "❌ Verbindung zur Cloud fehlgeschlagen.";

  }

};

</script>

</body>

</html>
